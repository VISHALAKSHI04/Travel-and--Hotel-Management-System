spring.application.name=api-gateway

server.port=8080


# =========================
# EUREKA SERVER
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# =========================
# HOTEL SERVICE
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=hotel-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://hotel-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/hotels/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1


