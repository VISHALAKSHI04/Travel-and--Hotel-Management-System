<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Booking | KODAI MIST</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">KODAI<span>MIST</span></a><nav><a href="index.html">Home</a><a href="rooms.html">Rooms</a><a class="active nav-btn" href="booking.html">Book Stay</a><a href="admin-login.html">Admin</a></nav></header><main><section class="booking-wrap wrap"><div class="booking-art"><p class="eyebrow">CUSTOMER PORTAL</p><h1>Welcome,<br><em id="welcomeName">Guest</em></h1><p>Request a reservation. Admin will review it and send the final response.</p><button type="button" onclick="logout()">Logout</button><div id="notifications" style="margin-top:25px"></div></div><form class="booking-form" id="bookingForm"><p class="eyebrow dark">RESERVATION REQUEST</p><h2>Book your stay</h2><label>Full name<input id="guestName" required readonly></label><label>Email<input id="guestEmail" required readonly></label><div class="two"><label>Check in<input id="checkIn" required type="date"></label><label>Check out<input id="checkOut" required type="date"></label></div><label>Room<select id="roomId"><option value="1">Mistwood Room</option><option value="2">Cloud Deck Suite</option><option value="3">Pine Cottage</option></select></label><button class="gold-btn full">Send booking request <span>→</span></button><p id="formMessage" class="form-note"></p><hr><h3>My booking status</h3><button type="button" onclick="loadBookings()">Refresh status</button><pre id="bookingStatus">Loading...</pre></form></section></main><script>const API_BASE='http://localhost:8080';
const user=JSON.parse(sessionStorage.getItem('loggedInUser')||'null');
const guestNameInput=document.getElementById('guestName');
const guestEmailInput=document.getElementById('guestEmail');
const welcomeNameEl=document.getElementById('welcomeName');
const roomIdInput=document.getElementById('roomId');
const checkInInput=document.getElementById('checkIn');
const checkOutInput=document.getElementById('checkOut');
const bookingForm=document.getElementById('bookingForm');
const formMessage=document.getElementById('formMessage');
const bookingStatus=document.getElementById('bookingStatus');
const notifications=document.getElementById('notifications');if(!user||sessionStorage.getItem('role')!=='customer'){location.href='login.html'}else{guestNameInput.value=user.name||'';guestEmailInput.value=user.email||'';welcomeNameEl.textContent=user.name||'Guest';loadBookings();loadNotifications()}function logout(){sessionStorage.clear();location.href='login.html'}bookingForm.addEventListener('submit',async e=>{e.preventDefault();formMessage.textContent='Sending booking...';const p={userId:user.id,hotelId:1,roomId:Number(roomIdInput.value),checkIn:checkInInput.value,checkOut:checkOutInput.value,guestName:guestNameInput.value,guestEmail:guestEmailInput.value};try{const r=await fetch(API_BASE+'/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw Error(d.message||'HTTP '+r.status);formMessage.textContent='Booking sent to admin. Status: '+d.status+' | ID: '+d.id;loadBookings()}catch(err){formMessage.textContent='Booking failed: '+err.message}});async function loadBookings(){try{const r=await fetch(API_BASE+'/api/bookings/user/'+user.id);const d=await r.json();bookingStatus.textContent=JSON.stringify(d,null,2)}catch(e){bookingStatus.textContent='Could not load booking status: '+e.message}}async function loadNotifications(){try{const r=await fetch(API_BASE+'/api/notifications');const d=await r.json();const a=(Array.isArray(d)?d:[d]).filter(n=>String(n.userId)===String(user.id));notifications.innerHTML='<h3>Notifications</h3>'+(a.length?a.map(n=>'<p><b>'+n.type+'</b>: '+n.message+'</p>').join(''):'<p>No response yet. Admin confirmation will appear here.</p>')}catch(e){notifications.innerHTML='<p>Notification API unavailable.</p>'}}setInterval(()=>{loadBookings();loadNotifications()},5000);</script></body></html>
